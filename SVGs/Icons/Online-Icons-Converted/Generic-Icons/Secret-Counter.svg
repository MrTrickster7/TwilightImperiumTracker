<svg xmlns="http://www.w3.org/2000/svg" width="344" height="397" viewBox="0 0 344 397" fill="none">
  <defs>
    <linearGradient id="frame" x1="172" y1="8" x2="172" y2="389" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B81"/>
      <stop offset="0.5" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="well" x1="172" y1="50" x2="172" y2="347" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A0A14"/>
      <stop offset="1" stop-color="#100509"/>
    </linearGradient>
    <linearGradient id="trim" x1="172" y1="8" x2="172" y2="389" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE4E8"/>
      <stop offset="0.45" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <!-- Outer classified frame — same pointy-top hex as Influence bg -->
  <path d="M172 8 L336.97 103.25 L336.97 293.75 L172 389 L7.03 293.75 L7.03 103.25 Z" fill="url(#frame)"/>

  <!-- Dark number well -->
  <path d="M172 44 L304.2 120.4 L304.2 276.6 L172 353 L39.8 276.6 L39.8 120.4 Z" fill="url(#well)"/>

  <!-- Inner trim ring, kept outside the digit area -->
  <path d="M172 56 L293.7 126.3 L293.7 270.7 L172 341 L50.3 270.7 L50.3 126.3 Z"
        fill="none" stroke="url(#trim)" stroke-width="3"/>

  <!-- Vertex chevrons: secret / classified marks on the frame only -->
  <g fill="none" stroke="url(#trim)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M157 30 L172 20 L187 30"/>
    <path d="M161 39 L172 31 L183 39"/>
    <path d="M157 367 L172 377 L187 367"/>
    <path d="M161 358 L172 366 L183 358"/>
  </g>

  <!-- Side hash marks sitting in the thick frame, away from the center -->
  <g fill="url(#trim)">
    <rect x="16.5" y="192.2" width="16" height="3.1" rx="1.2"/>
    <rect x="16.5" y="201.7" width="11" height="3.1" rx="1.2"/>
    <rect x="311.5" y="192.2" width="16" height="3.1" rx="1.2"/>
    <rect x="316.5" y="201.7" width="11" height="3.1" rx="1.2"/>
  </g>

  <!-- Corner ticks on the inner ring -->
  <g stroke="#FB7185" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
    <path d="M172 68 v12"/>
    <path d="M172 317 v12"/>
    <path d="M270 150 l-10 6"/>
    <path d="M270 247 l-10 -6"/>
    <path d="M74 150 l10 6"/>
    <path d="M74 247 l10 -6"/>
  </g>
</svg>
